<div class="debug-modes">
  <label id="job-in-debug-mode" style="display: none;" class="topbar-button" title="⚠️ One or more jobs are running in debug mode ⚠️">
    <i style="color:#4a4aeb" class="bi bi-bug"></i>
  </label>
  <label id="job-in-verbose-mode" style="display: none;" class="topbar-button" title="⚠️ One or more jobs are running in verbose mode ⚠️">
    <i style="color:#ffea01" class="bi bi-journal-text"></i>
  </label>
  <label class="topbar-button mirrorr-debug" title="⚠️ Mirrorr is running in debug mode ⚠️"
        style="display: {{ 'block' if settings.debug_mode == True else 'none' }};">
    <i style="color:#0808ab" class="bi bi-bug"></i>
  </label>
</div>
