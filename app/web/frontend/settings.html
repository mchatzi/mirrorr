<!DOCTYPE html>
<html lang="en">
{% include "parts/header.html" %}

<body>
  <header class="topbar">
    <div class="topbar-flex">
      {% include "parts/topbar.html" %}
      {% include "parts/debug-modes.html" %}
    </div>
  </header>

  <main>
    <section>
      <div class="section-header">
        <h2>Settings</h2>
        <div class="section-topbar">
          <a id="job-help-btn" title="Help me!" href="https://github.com/mchatzi/mirrorr/blob/main/docs/configuration.md" target="_blank" >
            <i style="font-size: 1.55rem" class="bi-question-circle"></i></a>
          <a id="settings-export-btn" title="Export"><i class="bi bi-arrow-down-circle"></i></a>
          <a id="settings-import-btn" href="#" title="Import"><i class="bi bi-arrow-up-circle"></i></a>
          <input type="file" id="settings-import-file" style="display: none" />
        </div>
      </div>
      <div class="section-main">
        <form id="settings-form">

          <fieldset>
            <legend>Appearance</legend>
            <label class="label-with-fieldset">
              Theme
              <select name="color_theme" id="settings-color_theme" 
                onchange="document.getElementById('main-theme').href = '/css/' + this.value + '.css';">
                <option value="color-theme-green">Foresti</option>
                <option value="color-theme-mauve">Lilia</option>
                <option value="color-theme-blue">Skyon</option>
                <option value="color-theme-pastel">Pastele</option>
                <option value="color-theme-brown">Vintagio</option>
                <option value="color-theme-denim">Denimee</option>
                <option value="color-theme-midnight">Moonat</option>
                <option value="color-theme-icegrey">Tarctic</option>
                <option value="color-theme-inverted">Darkulian</option>
                <option value="color-theme-monowhite">Papero</option>
              </select>
            </label>

            <fieldset class="short-inputs">
              <input type="checkbox" name="reverse_cron" id="settings-reverse_cron" />
              <label>reverse cron</label>
              <input type="checkbox" name="cool_timestamps" id="settings-cool_timestamps" />
              <label>cool timestamps</label>
            </fieldset>
          </fieldset>

          <fieldset class="short-inputs">
            <legend>Timings <i class="bi bi-info-circle" title="- Scheduler cycle: how often the scheduler checks for jobs that need running. 
- Refresh UI: how often the job list in the homepage auto-refreshes (when autoreload is enabled). 
- Keep job logs: how many job logs are kept for each job"></i>
            </legend>
            <label class="radiobox">
              Scheduler cycle
              <br/>
              <input type="radio" name="scheduler_cycle_s" value="10">10s</input>
              <input type="radio" name="scheduler_cycle_s" value="60">1m</input>
            </label>
            <label class="radiobox">
              Refresh UI
              <br/>
              <input type="radio" name="ui_refresher_s" value="5">5s</input>
              <input type="radio" name="ui_refresher_s" value="15">15s</input>
              <input type="radio" name="ui_refresher_s" value="60">1m</input>
            </label>
          </fieldset>

          <label>
            Environment
            <input type="text" name="environment" id="settings-environment" placeholder="backup server 2"/>
          </label>

          <fieldset>
            <legend>Reporters</legend>

            <span class="reporter-box" hidden>
              <a title="Delete" class="dim-button delete" onclick="deleteReporter(this)"><i class="bi bi-ban"></i></a>
              <label>
                Name
                <input type="text" class="reporter_name" placeholder="Name" />
              </label>
              <span class="checkbox-spacer"></span>
              <label class="label-with-fieldset">
                Endpoint url
                <input type="text" class="reporter_endpoint" placeholder="http://myserver.lan:5001/someendpoint?someparam=..." />
              </label>
              <fieldset class="short-inputs">
                <select class="reporter_method" required>
                  <option value="GET">get</option>
                  <option value="POST" selected>post</option>
                </select>
                <label>method</label>
                <input type="text" class="reporter_parameter_name" />
                <label>param name <i class="bi bi-info-circle" title="- Get: when empty, no payload is sent, unless there's a template, in which case the whole query is replaced with its output. Otherwise, the specified parameter is injected in the url and hodls the payload.
- Post: when empty, the payload is sent as json (application/json) and if a template is being used, it is expected to produce valid json. When not empty, the payload is sent as data (application/x-www-form-urlencoded) under the specified parameter name and if a template is used, its output is sent"></i></label>
                <input type="text" class="reporter_headers" placeholder="Authorization: Basic 9tZTpNIU4pJCRPcGVub2JzZXJ2ZQ" />
                <label>headers</label>
              </fieldset>
              <label>
                Template <span class="reporter_template_helper"></span>
                <textarea class="reporter_template"></textarea>
              </label>
            </span>

            <a title="Create" id="create-reporter-button" class="dim-button" onclick="addReporter()""><i class="bi bi-plus-circle"></i></a>
            <span class="checkbox-spacer"></span>
          </fieldset>

          <fieldset>
            <legend>Send Heartbeat</legend>
            <label class="label-with-fieldset">
              Heartbeat server
              <input type="text" name="health_heartbeat_url" id="settings-health_heartbeat_url" placeholder="http://myuptimekuma.lan:3001/api/push/abCDeFG?status=up&msg=yourmessage&ping=" />
            </label>
            <fieldset class="short-inputs">
              <input type="checkbox" name="send_job_status" id="settings-send_job_status" />
              <label>send job status</label>
              <input type="checkbox" name="send_reporters_status" id="settings-send_reporters_status" />
              <label>send reporters status</label>
            </fieldset>
          </fieldset>

          <label>
            Remote SSH Port <i class="bi bi-info-circle" title="When using remote shares, fill in the port that the remote ssh server is listening on"></i>
            <input type="number" name="remote_ssh_port" id="settings-remote_ssh_port" placeholder="22"/>
          </label>

          <label>
            Server Address <i class="bi bi-info-circle" title="A fully qualified address of the mirrorr server. This is used when creating the link to the logs of your job report. Don't use a trailing slash"></i>
            <input type="text" name="server_address" id="settings-server_address" placeholder="(Using auto-detected domain address or ip)"/>
          </label>

          <button type="submit">Save</button>
          <button type="button" onclick="window.location.href='index.html'" class="back-btn">Home</button>
          <span id="save-status" style="visibility:hidden; margin-left: 14px;font-size: 1.6rem; vertical-align: middle;"><i class="bi bi-check"></i></span>

          <span class="settings-mirrorr-version">
            {{ '::v' ~ settings.mirrorr_version ~ '::' if settings.mirrorr_version else '' }}
          </span>
        </form>
      </div>
    </section>
  </main>

  {% include "parts/footer.html" %}
  <script src="js/settings.js"></script>
</body>

</html>
